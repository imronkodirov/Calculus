<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webster University — Faculty Rent Tracker v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Base Styles from Original Prototype [cite: 1691-1713] */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0d1b3e; --navy-mid: #1a3060; --navy-light: #e8edf8;
    --accent: #2563b0; --accent-soft: #dbeafe;
    --green: #166534; --green-bg: #dcfce7;
    --amber: #92400e; --amber-bg: #fef3c7;
    --gray: #6b7280; --gray-bg: #f3f4f6;
    --red: #991b1b; --red-bg: #fee2e2;
    --border: #e2e8f0; --text: #0f172a;
    --text-muted: #64748b; --bg: #f8fafc; --white: #ffffff;
    --radius: 8px; --radius-lg: 12px;
  }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  
  /* Layout Components [cite: 1722-1807] */
  .header { background: var(--navy); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-size: 13px; font-weight: 600; color: #fff; letter-spacing: 0.04em; text-transform: uppercase; }
  .header-fy { font-size: 12px; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); padding: 3px 10px; border-radius: 20px; font-family: 'IBM Plex Mono', monospace; }

  .tab-nav { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; }
  .tab-btn { padding: 12px 20px; border: none; background: none; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--accent); }

  /* Table and Dashboard Styling [cite: 1812-1857] */
  .table-wrapper { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin: 1.5rem 2rem; }
  .scroll-wrapper { overflow-x: auto; max-width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th { background: var(--bg); padding: 10px; text-align: left; font-size: 10px; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .sticky-col { position: sticky; left: 0; background: var(--white); z-index: 10; border-right: 1px solid var(--border); }
  
  /* Indicators [cite: 1860-1891] */
  .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 500; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-blue { background: var(--accent-soft); color: var(--accent); }
  .method-pill { font-size: 9px; padding: 1px 6px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
  .to-emp { background: #eff6ff; color: #1d4ed8; border: 1px solid #dbeafe; }
  .to-ll { background: #f0fdf4; color: #15803d; border: 1px solid #dcfce7; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">Webster University — Rent Tracker</div>
  <span class="header-fy">FY 2025–2026</span>
</div>

<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('tab1', this)">Faculty Rent Register</button>
  <button class="tab-btn" onclick="switchTab('tab3', this)">Payment Schedule History</button>
</div>

<div id="tab1" class="tab-content" style="display:block;">
  <div class="table-wrapper">
    <div class="scroll-wrapper">
      <table>
        <thead>
          <tr id="reg-header-top">
            <th rowspan="2" class="sticky-col">Faculty ID / Name</th>
            <th rowspan="2">Type</th>
            <th rowspan="2">Allowance</th>
            </tr>
          <tr id="reg-header-sub">
            </tr>
        </thead>
        <tbody id="register-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="tab3" class="tab-content" style="display:none; padding: 2rem;">
  <div style="background:white; padding:1.5rem; border-radius:12px; border:1px solid var(--border);">
    <h3 style="margin-bottom:1rem; font-size:14px;">Audit History — All Payments</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Faculty</th>
          <th>Month</th>
          <th>Amount Paid</th>
          <th>Date Paid</th>
          <th>Recipient</th> <th>Status</th>
        </tr>
      </thead>
      <tbody id="schedule-body"></tbody>
    </table>
  </div>
</div>

<script>
const months = ['May-25','Jun-25','Jul-25','Aug-25','Sep-25','Oct-25','Nov-25','Dec-25','Jan-26','Feb-26','Mar-26','Apr-26'];

// Expanded data showing monthly method variation [cite: 2202, 2215]
const facultyData = [
  {
    id: 'FAC-001', name: 'Dr. Sarah Mitchell', occupancy: 'Single', allowance: 500,
    payments: {
      'May-25': { amt: 500, date: '01 May', method: 'Employee' },
      'Jun-25': { amt: 500, date: '02 Jun', method: 'Landlord' }, // Method changed
      'Jul-25': { amt: 500, date: '01 Jul', method: 'Employee' }
    }
  },
  {
    id: 'FAC-002', name: 'Prof. James Chen', occupancy: 'Couple', allowance: 700,
    payments: {
      'May-25': { amt: 700, date: '01 May', method: 'Landlord' },
      'Jun-25': { amt: 700, date: '01 Jun', method: 'Landlord' }
    }
  }
];

function buildUI() {
  const topRow = document.getElementById('reg-header-top');
  const subRow = document.getElementById('reg-header-sub');
  const tbody = document.getElementById('register-body');
  const sBody = document.getElementById('schedule-body');

  // Build Headers [cite: 2114-2143]
  months.forEach(m => {
    const th = document.createElement('th');
    th.colSpan = 3; th.style.textAlign = 'center'; th.style.background = '#e8edf8';
    th.innerText = m;
    topRow.appendChild(th);
    subRow.innerHTML += `<th style="text-align:right">Amt</th><th>Date</th><th>To</th>`;
  });

  // Build Tab 1 & Tab 3 [cite: 2313, 2415]
  facultyData.forEach(f => {
    let row = `<tr><td class="sticky-col"><strong>${f.id}</strong><br><small>${f.name}</small></td>`;
    row += `<td><span class="badge ${f.occupancy==='Couple'?'badge-amber':'badge-blue'}">${f.occupancy}</span></td>`;
    row += `<td style="font-weight:600">$${f.allowance}</td>`;

    months.forEach(m => {
      const p = f.payments[m];
      if (p) {
        const mClass = p.method === 'Employee' ? 'to-emp' : 'to-ll';
        row += `<td style="text-align:right; font-family:monospace">$${p.amt}</td>`;
        row += `<td style="font-size:10px">${p.date}</td>`;
        row += `<td><span class="method-pill ${mClass}">${p.method}</span></td>`;
        
        // Tab 3 history [cite: 2452-2463]
        sBody.innerHTML += `<tr>
          <td>${f.id}</td><td>${f.name}</td><td>${m}</td>
          <td style="font-weight:600">$${p.amt}</td><td>${p.date}</td>
          <td><span class="method-pill ${mClass}">${p.method}</span></td>
          <td><span class="badge badge-green">Paid</span></td>
        </tr>`;
      } else {
        row += `<td colspan="3" style="text-align:center; color:#ccc">—</td>`;
      }
    });
    tbody.innerHTML += row + `</tr>`;
  });
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).style.display = 'block';
  btn.classList.add('active');
}

buildUI();
</script>
</body>
</html>
